[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify2csv"
version = "1.0.1"
description = "Export your Spotify Liked Songs to a CSV file."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "GrimSythe" }]
dependencies = ["spotipy>=2.26,<3"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
spotify2csv = "spotify2csv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
